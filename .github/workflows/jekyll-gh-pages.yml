name: Deploy to GitHub Pages

on:
  # main ブランチへのプッシュ時に実行
  push:
    branches: ['main']
  # GitHub Actions 画面からの手動実行を許可
  workflow_dispatch:

# GitHub Pages へのデプロイに必要な権限
permissions:
  contents: read
  pages: write
  id-token: write

# 進行中のデプロイを中断せず、重複実行を直列化する
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  # ビルドジョブ
  build:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4
      - name: Node.js をセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: 依存パッケージをインストール
        run: npm ci
      - name: アプリケーションをビルド
        run: npm run build
      - name: GitHub Pages を設定
        uses: actions/configure-pages@v5
      - name: ビルド成果物をアップロード
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  # デプロイジョブ
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: GitHub Pages へデプロイ
        id: deployment
        uses: actions/deploy-pages@v5
